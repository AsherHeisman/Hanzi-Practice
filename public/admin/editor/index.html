<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="color-scheme" content="light dark"><title>Textbook editor - Hanzi Learning</title><link rel="icon" href="/assets/favicon.svg"><link rel="stylesheet" href="/admin/editor/style.css"></head>
<body data-page="admin"><header id="site-header"></header><main class="page" id="main-content"><div class="page-heading"><div><h1>Textbook editor</h1><p class="muted">Organize your curriculum. Give every word a place.</p></div><button class="secondary" id="logout">Lock & sign out</button></div><nav class="admin-nav" aria-label="Admin"><a href="/admin">Overview</a><a class="active" href="/admin/editor" aria-current="page">Textbook editor</a><a href="/">View learning site <span class="material-symbols-outlined icon" aria-hidden="true">arrow_outward</span></a></nav>
<div class="editor-toolbar"><label>Editing<select id="editor-book"><option value="1">Textbook 1</option><option value="2">Textbook 2</option></select></label><button id="import-button" class="secondary">Import JSON</button><input type="file" id="import-file" accept=".json,application/json" hidden><button id="export-button" class="secondary">Export draft</button><div class="toolbar-end"><button id="new-book" class="quiet">Start blank</button><button id="save-book">Save changes</button></div></div>
<div class="notice" id="admin-message" role="status">Loading textbook…</div><p class="breadcrumb" id="editor-summary"></p>
<div class="editor-layout"><aside class="panel editor-tree"><button id="add-unit" class="secondary">+ Add unit</button><div id="editor-tree"></div></aside><section class="panel editor-form" id="editor-form" aria-label="Edit selected lesson"></section></div>
</main><footer id="site-footer"></footer><script src="/shared/common.js"></script><script src="/admin/shared/session.js"></script><script type="module" src="/admin/editor/script.js"></script></body></html>
