<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="color-scheme" content="light dark"><title>Admin sign in - Hanzi Learning</title><link rel="icon" href="/assets/favicon.svg"><link rel="stylesheet" href="/login/style.css"></head>
<body data-page="admin" class="pin-login"><header id="site-header"></header><main class="page login-page" id="main-content">
<section class="login-card"><h1>Enter your PIN</h1>
<label class="pin-entry" aria-label="Four-digit admin PIN"><input class="pin-input" id="pin-input" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" aria-label="Four-digit admin PIN" aria-describedby="pin-error-msg"><span class="pin-dots" id="pin-dots" aria-hidden="true"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></span></label>
<p id="pin-error-msg" role="status" aria-live="polite">Checking access…</p><div class="pin-keypad" id="pin-keypad" aria-label="PIN keypad"></div><a href="/" class="back-link muted login-back"><span class="material-symbols-outlined icon" aria-hidden="true">arrow_back</span><span class="back-label">Back to learning</span></a></section>
</main><footer id="site-footer"></footer><script src="/shared/common.js"></script><script src="/login/script.js"></script></body></html>
